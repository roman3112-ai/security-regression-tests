[project]
name = "security-regression-tests"
version = "0.1.0"
description = "Security regression tests: insecure vs. hardened FastAPI endpoints, with tests that lock in the fixes."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
